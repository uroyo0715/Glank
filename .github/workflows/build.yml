name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  # mainへのpush（PRではない）でビルド成功時のみ、Cloudflare Workers(フロント)へ自動デプロイする。
  # サーバー(server/)はRenderがGitHub連携で自動デプロイするが、フロントはpushだけでは更新されず
  # 手動でwrangler deployが必要だったため、そのギャップを埋める。
  # 事前にリポジトリのSecretsに CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID の登録が必要。
  deploy:
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
